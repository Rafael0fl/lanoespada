    <!-- SPA fallback para GitHub Pages: restaura la ruta original cuando
         se entra directo a una ruta client-side (ej. /login). -->
    <script>
      (function() {
        var redirect = window.location.search.match(/redirect=([^&]*)/);
        if (redirect) {
          var path = redirect[1].replace(/~and~/g, '&');
          var base = window.location.pathname.split('/').slice(0, 2).join('/');
          if (window.history.replaceState) {
            window.history.replaceState(null, null, base + '/' + path + window.location.hash);
          } else {
            window.location.pathname = base + '/' + path;
          }
        }
      })();
    </script>
