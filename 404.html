<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>La No Espada</title>
    <!-- SPA fallback para GitHub Pages: redirige rutas client-side (ej. /login)
         al index.html preservando la ruta original en ?redirect=. -->
    <script>
      (function() {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?redirect=' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
